{% extends "base.html" %}

{% block extra_css %}
<style>
  .lobby-section {
    padding: 2.5rem 0 4.5rem;
  }
  .lobby-card {
    background: var(--bg-surface);
    border: 3px solid var(--arcade-blue);
    border-radius: var(--radius-sm);
    padding: 2.5rem 2rem;
    max-width: 680px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 6px 6px 0 #000, 0 0 25px rgba(34, 211, 238, 0.15);
  }
  .lobby-header-badge {
    display: inline-block;
    font-family: var(--font-pixel);
    font-size: 0.65rem;
    color: var(--pixel-cyan);
    background: rgba(34, 211, 238, 0.12);
    border: 1px solid var(--pixel-cyan);
    padding: 0.3rem 0.8rem;
    margin-bottom: 0.8rem;
    letter-spacing: 0.08em;
  }
  .lobby-title {
    font-family: var(--font-pixel);
    font-size: clamp(1.2rem, 3.5vw, 1.8rem);
    color: var(--arcade-yellow);
    text-shadow: 2px 2px 0 #000;
    margin-bottom: 1rem;
    letter-spacing: 0.04em;
  }
  .lobby-room-badge {
    display: inline-block;
    background: #040c1d;
    border: 3px solid var(--pixel-cyan);
    color: var(--arcade-yellow);
    font-family: var(--font-pixel);
    font-size: clamp(1.8rem, 5vw, 2.5rem);
    letter-spacing: 0.12em;
    padding: 0.6rem 2rem;
    border-radius: var(--radius-sm);
    margin: 0.5rem 0 1.5rem;
    box-shadow: 4px 4px 0 #000, 0 0 20px rgba(34, 211, 238, 0.35);
    text-shadow: 2px 2px 0 #000;
  }
  .lobby-actions-row {
    display: flex;
    justify-content: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    margin-bottom: 2rem;
  }
  .lobby-actions-row .btn {
    font-family: var(--font-pixel);
    font-size: 0.72rem;
    padding: 0.6rem 1rem;
    letter-spacing: 0.04em;
  }
  .players-box {
    background: #040c1d;
    border: 2px solid var(--arcade-blue);
    border-radius: var(--radius-sm);
    padding: 1.5rem;
    margin-bottom: 2rem;
    text-align: left;
    box-shadow: 3px 3px 0 #000;
  }
  .players-header {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-pixel);
    font-size: 0.72rem;
    color: var(--pixel-cyan);
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
    border-bottom: 2px dashed rgba(34, 211, 238, 0.25);
    padding-bottom: 0.5rem;
  }
  .lobby-player-badge {
    background: var(--arcade-blue);
    border: 2px solid var(--pixel-cyan);
    padding: 0.5rem 1rem;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--font-pixel);
    font-size: 0.72rem;
    color: var(--arcade-yellow);
    margin: 0.3rem;
    box-shadow: 2px 2px 0 #000;
  }
  #btnStartFriendMatch {
    font-family: var(--font-pixel);
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    padding: 1rem 1.5rem;
  }
</style>
{% endblock %}

{% block content %}
<section class="lobby-section">
  <div class="container">
    <div class="lobby-card">
      <div class="lobby-header-badge">MULTIPLAYER LOBBY</div>
      <h1 class="lobby-title">ASSEMBLE YOUR SQUAD</h1>

      <div class="lobby-room-badge" id="displayRoomCode">{{ room_code }}</div>

      <div class="lobby-actions-row">
        <button type="button" class="btn btn-secondary btn-sm" id="btnCopyCode">
          📋 COPY CODE
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnShareLink">
          🔗 SHARE LINK
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnToggleQr">
          📱 SHOW QR
        </button>
      </div>

      <!-- QR Code Container (toggleable) -->
      <div id="qrDropdownWrap" style="display:none; margin-bottom:2rem;">
        <img src="/api/qr/{{ room_code }}" alt="Room QR Code" style="width:200px; height:200px; border-radius:4px; border:3px solid var(--arcade-blue); background:#fff; padding:8px; box-shadow:4px 4px 0 #000;">
        <p style="font-family:var(--font-mono); font-size:1.2rem; color:var(--text-dim); margin-top:0.6rem;">Scan using phone camera to join instantly</p>
      </div>

      <!-- Connected Players -->
      <div class="players-box">
        <div class="players-header">
          <span>CONNECTED DETECTIVES</span>
          <span id="liveParticipantCount">1</span>
        </div>
        <div id="lobbyPlayersList" style="display:flex; flex-wrap:wrap;">
          <!-- Dynamically filled by multiplayer.js -->
        </div>
      </div>

      <button type="button" class="btn btn-primary btn-lg" id="btnStartFriendMatch" style="width:100%;">
        START CHALLENGE MATCH ▶
      </button>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/multiplayer.js') }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const roomCode = "{{ room_code }}";
    const mp = new MultiplayerManager("lobby", roomCode);
    mp.init();

    const btnCopy = document.getElementById("btnCopyCode");
    const btnShare = document.getElementById("btnShareLink");
    const btnQr = document.getElementById("btnToggleQr");
    const qrWrap = document.getElementById("qrDropdownWrap");
    const btnStart = document.getElementById("btnStartFriendMatch");

    const joinUrl = `${window.location.origin}/join/${roomCode}`;

    if (btnCopy) {
      btnCopy.addEventListener("click", () => {
        navigator.clipboard.writeText(roomCode);
        window.showToast("Room code copied!");
      });
    }

    if (btnShare) {
      btnShare.addEventListener("click", () => {
        if (navigator.share) {
          navigator.share({
            title: "Join my AI vs ASLI squad!",
            text: `Join my AI vs ASLI challenge room: ${roomCode}`,
            url: joinUrl
          }).catch(() => {});
        } else {
          navigator.clipboard.writeText(joinUrl);
          window.showToast("Join link copied to clipboard!");
        }
      });
    }

    if (btnQr && qrWrap) {
      btnQr.addEventListener("click", () => {
        qrWrap.style.display = qrWrap.style.display === "none" ? "block" : "none";
      });
    }

    if (btnStart) {
      btnStart.addEventListener("click", () => {
        window.soundFx.click();
        window.location.href = `/game/host/${roomCode}`;
      });
    }
  });
</script>
{% endblock %}
