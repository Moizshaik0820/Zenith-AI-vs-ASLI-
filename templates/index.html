{% extends "base.html" %}

{% block content %}
<!-- Hacker Green Code Rain Background Canvas -->
<canvas id="matrixCanvas" class="matrix-code-canvas" aria-hidden="true"></canvas>

<section class="home-hero-stage">
  <!-- Standing Upright 3D Rotating Zenith Shield on Top Right Corner -->
  <div class="shield-top-right-anchor" id="shieldTopRightAnchor">
    <div class="standing-shield-3d" id="standingShield" title="Swipe or drag to spin the Zenith shield">
      <img 
        src="{{ url_for('static', filename='images/zenith-shield.png') }}" 
        alt="Zenith Shield Emblem" 
        class="standing-shield-graphic" 
        id="standingShieldGraphic"
        draggable="false"
      >
    </div>
  </div>

  <!-- Hero Content Foreground (Perfect Vertical & Horizontal Balance) -->
  <div class="container hero-focus-container">
    <div class="hero-title-wrap">
      <h1 class="chunky-hero-title">
        <span class="ai-chunky-word">AI</span>
        <span class="vs-chunky-word">vs</span>
        <span class="asli-chunky-word">ASLI</span>
      </h1>
      <h2 class="chunky-hero-tagline" data-i18n="hero_tagline">Do you trust your eyes?</h2>
    </div>

    <!-- Primary & Secondary Action Buttons (Strictly no emojis) -->
    <div class="hero-action-cluster">
      <a href="{{ url_for('pages.nickname') }}" class="btn btn-primary btn-hero-primary" data-i18n="btn_enter_challenge">
        ENTER THE CHALLENGE
      </a>
      <a href="{{ url_for('pages.guide') }}" class="btn btn-secondary btn-hero-secondary" data-i18n="btn_how_to_play">
        HOW TO PLAY
      </a>
    </div>
  </div>

  <!-- Floating Meme Popup on Bottom Left (Transparent Cutout, No Box Background, Dismissible) -->
  <div class="meme-bottom-left-popup" id="homeMemePopup" role="complementary" aria-label="Welcome announcement">
    <button type="button" class="meme-sticker-close-btn" id="memeCloseBtn" aria-label="Dismiss">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img src="{{ url_for('static', filename='images/meme-chaliye-shuru.webp') }}" alt="Chaliye Shuru Karte Hai" class="meme-sticker-img" loading="eager">
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}
